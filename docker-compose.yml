services:
  postgres:
    image: postgres:16-alpine
    container_name: ecdat-postgres
    restart: always
    environment:
      POSTGRES_USER: ecdat_user
      POSTGRES_PASSWORD: ecdat_secure_password_2026
      POSTGRES_DB: ecdat_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat_user -d ecdat_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecdat-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecdat-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://ecdat_user:ecdat_secure_password_2026@postgres:5432/ecdat_production
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: ecdat-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://ecdat_user:ecdat_secure_password_2026@postgres:5432/ecdat_production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecdat-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
