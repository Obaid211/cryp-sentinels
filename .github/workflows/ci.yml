name: ECDAT Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-validation:
    name: Backend Tests & Cryptographic Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Phase 1 End-to-End Verification
        run: |
          python verify_phase1_end_to_end.py

      - name: Run Phase 2 Binary & Container Scanner Verification
        run: |
          python test_phase2.py

      - name: Run Phase 3 HSM & Cloud KMS Verification
        run: |
          python test_phase3.py

  frontend-validation:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Oxlint Code Quality Check
        run: npm run lint

      - name: Vite Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://mdpacbqwskcjpgwtvonk.supabase.co"
          VITE_SUPABASE_ANON_KEY: "dummy-key-for-ci-build"

  docker-build-check:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ecdat-backend:test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ecdat-frontend:test
          build-args: |
            VITE_SUPABASE_URL=https://mdpacbqwskcjpgwtvonk.supabase.co
            VITE_SUPABASE_ANON_KEY=dummy-key-for-ci-build
